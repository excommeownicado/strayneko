name: Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev libxext-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install package
        run: |
          cmake --install build \
            --prefix "$PWD/release"

      - name: Copy license and installer
        run: |
          cp LICENSE release/
          cp install.sh release/
          cp uninstall.sh release/

      - name: Create archive
        run: |
          tar -czf \
            strayneko-${GITHUB_REF_NAME}-linux.tar.gz \
            -C release .

      - name: Validate archive
        run: |
          tar -tzf strayneko-${GITHUB_REF_NAME}.tar.gz

      - name: Validate scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Extract version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract changelog
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" {
              found=1
              next
            }
            found && $0 ~ "^## " {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

      - name: Create archive
        run: |
          tar -czf \
            "strayneko-${VERSION}-linux.tar.gz" \
            -C release .

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: strayneko ${{ env.VERSION }}
          body_path: release-notes.md
          files: strayneko-${{ env.VERSION }}-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
