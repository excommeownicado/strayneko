name: Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev libxext-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build strayneko
        run: |
          cd build
          cmake --build . --config Release

      - name: Package release artifact
        run: |
          mkdir -p release
          cp build/src/strayneko release/
          cp README.md LICENSE CREDITS strayneko.man release/
          cp install.sh release/ 2>/dev/null || true
          cp -r desktop release/
          tar -czf strayneko-${GITHUB_REF_NAME}-linux.tar.gz -C release .

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release build for ${{ github.ref_name }}
          files: strayneko-${{ github.ref_name }}-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
