name: Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev libxext-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build strayneko
        run: cmake --build build

      - name: Package release artifact
        run: |
          mkdir -p release
          cp "$(find build -type f -name strayneko | head -n1)" release/
          cp LICENSE docs/strayneko.6 release/
          cp install.sh uninstall.sh release/
          cp -r resources/desktop release/
          tar -czf strayneko-${GITHUB_REF_NAME}-linux.tar.gz -C release .

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release build for ${{ github.ref_name }}
          files: strayneko-${{ github.ref_name }}-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
