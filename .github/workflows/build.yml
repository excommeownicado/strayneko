name: Build

on:
  push:
    branches:
      - main
      - agent/refactor-core-architecture
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            shellcheck

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_DEBUG=ON

      - name: Build
        run: |
          cmake --build build --parallel

  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            shellcheck

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

  clang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libx11-dev \
            libxext-dev \
            libxrandr-dev

      - name: Configure
        run: |
          CC=clang cmake -B build-clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_DEBUG=ON

      - name: Build
        run: |
          cmake --build build-clang --parallel

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxext-dev \
            libxrandr-dev

      - name: Configure
        run: |
          cmake -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Build
        run: |
          cmake --build build-sanitizers --parallel

  shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: ShellCheck
        run: |
          shellcheck install.sh
          shellcheck uninstall.sh

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            shellcheck

      - name: Configure tests
        run: |
          cmake -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=ON

      - name: Build tests
        run: |
          cmake --build build-tests --parallel

      - name: Run tests
        run: |
          ctest --test-dir build-tests --output-on-failure
